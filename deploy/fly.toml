# Fly.io deployment for the cxq server.
# One shared-CPU VM, 256 MB RAM, 1 GB volume — sized to stay inside Fly.io's
# free allowance (see deploy/README.md for the honest cost note).
app = "cxq-queue"
primary_region = "mia"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  CXQ_DB = "/data/tasks.db"

[[mounts]]
  source = "cxq_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory_mb = 256

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/v1/health"
    timeout = "5s"
